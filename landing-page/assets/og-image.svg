<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f1f35"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Microscope icon (centered, larger) -->
  <g transform="translate(500, 140) scale(3.5)">
    <!-- Base -->
    <rect x="6" y="40" width="22" height="4" rx="2" fill="#4a6fa5"/>
    <!-- Base support -->
    <rect x="12" y="37" width="10" height="3" rx="1" fill="#4a6fa5"/>
    <!-- Stage -->
    <rect x="8" y="28" width="18" height="3" rx="1" fill="#ffffff" opacity="0.8"/>
    <!-- Stage clips -->
    <rect x="7" y="27" width="3" height="1.5" rx="0.5" fill="#4a6fa5"/>
    <rect x="24" y="27" width="3" height="1.5" rx="0.5" fill="#4a6fa5"/>
    <!-- Body tube -->
    <rect x="15" y="10" width="4" height="18" rx="1" fill="#4a6fa5"/>
    <!-- Arm connector -->
    <path d="M17 31 L17 37" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- Eyepiece -->
    <rect x="13" y="4" width="8" height="6" rx="2" fill="#4a6fa5"/>
    <!-- Eyepiece lens -->
    <rect x="15" y="2" width="4" height="3" rx="1" fill="#ffffff" opacity="0.8"/>
    <!-- Objective lens -->
    <circle cx="17" cy="26" r="2" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
    <!-- Focus knob -->
    <circle cx="22" cy="22" r="2" fill="#ffffff" opacity="0.8"/>
  </g>

  <!-- Company name -->
  <text x="600" y="440" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="bold" fill="#ffffff" text-anchor="middle">PetroScientific</text>

  <!-- Tagline -->
  <text x="600" y="500" font-family="Arial, Helvetica, sans-serif" font-size="32" fill="#4a6fa5" text-anchor="middle">Quality Control Services</text>

  <!-- Subtitle -->
  <text x="600" y="560" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#ffffff" opacity="0.7" text-anchor="middle">Expert Calibration, Repair &amp; Validation of Scientific Instruments</text>
</svg>
