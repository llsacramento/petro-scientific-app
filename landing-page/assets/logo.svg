<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <!-- Microscope icon (within 0-42px horizontal space) -->
  <g transform="translate(5, 3)">
    <!-- Base -->
    <rect x="6" y="40" width="22" height="4" rx="2" fill="#1e3a5f"/>
    <!-- Base support foot -->
    <rect x="12" y="37" width="10" height="3" rx="1" fill="#1e3a5f"/>
    <!-- Stage (platform) -->
    <rect x="8" y="28" width="18" height="3" rx="1" fill="#4a6fa5"/>
    <!-- Stage clips -->
    <rect x="7" y="27" width="3" height="1.5" rx="0.5" fill="#1e3a5f"/>
    <rect x="24" y="27" width="3" height="1.5" rx="0.5" fill="#1e3a5f"/>
    <!-- Body tube (arm) -->
    <rect x="15" y="10" width="4" height="18" rx="1" fill="#1e3a5f"/>
    <!-- Arm connector (curved support) -->
    <path d="M17 31 L17 37" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round"/>
    <!-- Eyepiece -->
    <rect x="13" y="4" width="8" height="6" rx="2" fill="#1e3a5f"/>
    <!-- Eyepiece lens (top) -->
    <rect x="15" y="2" width="4" height="3" rx="1" fill="#4a6fa5"/>
    <!-- Objective lens (bottom of tube) -->
    <circle cx="17" cy="26" r="2" fill="#ffffff" stroke="#1e3a5f" stroke-width="1"/>
    <!-- Focus knob -->
    <circle cx="22" cy="22" r="2" fill="#4a6fa5"/>
  </g>
  <!-- Company name -->
  <text x="52" y="24" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1e3a5f">PetroScientific</text>
  <!-- Tagline -->
  <text x="52" y="40" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4a6fa5">Quality Control Services</text>
</svg>
